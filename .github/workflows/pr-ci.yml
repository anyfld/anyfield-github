name: PR CI
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  pull-requests: read
jobs:
  validate-pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - pr-title
      - pr-body
    steps:
      - run: |
          echo "PR title: $PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          requireScope: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pr-body:
    name: PR body empty check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          if [[ -z "$PR_BODY" ]]; then
            echo "PR body is empty"
            exit 1
          fi
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
